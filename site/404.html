<title>Page not found - Feedwire</title>
<style>
:root{color-scheme:light dark;--bg:#faf9f5;--ink:#202d2a;--muted:#586760;--rule:#d9dfd8;--accent:#25674f}

body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6;display:grid;place-items:center;min-height:100vh;padding:24px}
main{max-width:560px;text-align:center}
.brand{font-size:21px;font-weight:750;text-decoration:none;letter-spacing:-1px;color:inherit}
.brand span{color:var(--accent);margin-right:7px}
h1{font-size:44px;letter-spacing:-.04em;margin:28px 0 12px;font-weight:650}
p{color:var(--muted);margin:0 0 26px}
a.button{display:inline-flex;align-items:center;min-height:46px;padding:10px 20px;border:1px solid var(--rule);border-radius:5px;text-decoration:none;font-size:14px;font-weight:600;color:inherit}
a.button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
@media(prefers-color-scheme:dark){:root{--bg:#101b18;--ink:#e4ebe5;--muted:#a2b6ab;--rule:#30443a;--accent:#92d2ad}
a.button.primary{color:#101b18}}
</style>
</head>
