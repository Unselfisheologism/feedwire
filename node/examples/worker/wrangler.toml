name = "feedwire"
main = "worker.mjs"
compatibility_date = "2024-11-01"

# Text imports for the dashboard HTML (JSON imports work out of the box).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# D1 database. No database_id on purpose: when Cloudflare deploys from Git,
# it creates the database for you (automatic provisioning) and binds it as DB.
# With the CLI you can still pin one by adding: database_id = "<id from wrangler d1 create>"
[[d1_databases]]
binding = "DB"
database_name = "feedwire"

# The admin token is NOT stored here. Set it as a secret named FEEDBACK_ADMIN_TOKEN
# (dashboard: Worker > Settings > Variables and Secrets, or: npx wrangler secret put FEEDBACK_ADMIN_TOKEN)
