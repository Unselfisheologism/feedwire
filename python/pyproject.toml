[project]
name = "superfeeck"
version = "0.1.0"
description = "A /feedback endpoint for your API so AI agents can report bugs and missing features. FastAPI router."
requires-python = ">=3.9"
dependencies = ["fastapi"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["superfeedback"]

[tool.setuptools.package-data]
superfeedback = ["dashboard.html", "feedback.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
